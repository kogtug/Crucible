name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Run test suite
        run: npm test

      - name: Smoke-test the CLI against both reference fixtures
        run: npm run scan:basic && npm run scan:stateless

      - name: Smoke-test the chaos engine against the modern fixture (gating)
        run: node packages/cli/dist/index.js chaos -- node packages/fixtures/stateless-server/dist/index.js

      - name: Smoke-test the chaos engine against the legacy fixture (tracking only, see FINDINGS.md)
        # Exits 1 by design: this fixture is built on @modelcontextprotocol/sdk,
        # which has a documented (not spec-mandated) robustness gap around
        # malformed input - see FINDINGS.md. Kept non-gating so CI doesn't
        # need editing every time the finding is re-confirmed; the run itself
        # still executes and its output is visible in the log.
        run: node packages/cli/dist/index.js chaos -- node packages/fixtures/basic-server/dist/index.js || true

      - name: Smoke-test scan over a real Streamable HTTP connection (both fixtures)
        # Unlike the in-process HTTP tests in `npm test`, this starts each
        # fixture as a genuine background process and points the CLI at its
        # URL - the same path a person running this against a real server
        # would take.
        run: |
          PORT=8080 node packages/fixtures/stateless-server/dist/httpServer.js &
          PORT=8081 node packages/fixtures/basic-server/dist/httpServer.js &
          sleep 1
          node packages/cli/dist/index.js scan http://localhost:8080/
          node packages/cli/dist/index.js scan http://localhost:8081/
